<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits - UTD Budget</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <nav class="sidebar">
            <h2>UTD Budget</h2>
            <ul>
                <li><a href="index.html">Fall 25 - Spring 26 Budget</a></li>
                <li><a href="budgetCuts.html">Budget Cuts</a></li>
                <li><a href="budgetOverTime.html">Budget Over Time</a></li>
                <li><a href="studentFees.html">Student Fees</a></li>
                <li><a href="schoolBudgets.html">Budget by School </a></li>
                <li><a href="aux-budget.html">Auxiliary Budget</a></li>
                <li><a href="credits.html" class="active">Credits</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="https://sg.utdallas.edu/" target="_blank">
                    <img src="assets/sgGavel26.png" alt="Student Government Logo" class="utd-logo">
                </a>
            </div>
        </nav>

        <main class="main-content">
            <header>
                <h1>Credits</h1>
                <p>Contributors and acknowledgments for this project</p>
            </header>

            <section class="credits-content">
                <div class="credits-section">
                    <h2>Leadership</h2>
                    <div id="contributors-list" class="people-grid">
                        </div>
                </div>

                    <div class="credits-flex-container">
                        <div class="useful-links-box">
                            <div class="link-images" id="social-links-container">
                                </div>
                        </div>

                        <div class="pictures-box">
                            <div class="pictures-grid">
                                <img src="assets/buildABudget1.JPG" alt="Project Photo 1" class="gallery-img">
                                <img src="assets/buildABudget2.JPG" alt="Build A Budget Project" class="gallery-img">
                                <img src="assets/buildABudget4.JPG" alt="Build A Budget Project" class="gallery-img">
                            </div>
                        </div>
                    </div>

                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Load Leadership data
        fetch('people.json')
            .then(response => response.json())
            .then(data => {
                const contributorsContainer = document.getElementById('contributors-list');
                data.contributors.forEach(person => {
                    const card = document.createElement('div');
                    card.className = 'person-card';
                    const imageHtml = person.image ? `<img src="${person.image}" alt="${person.name}" class="person-img">` : '';
                    card.innerHTML = `
                        ${imageHtml}
                        <h3>${person.name}</h3>
                        <p class="role">${person.role}</p>
                    `;
                    contributorsContainer.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading people.json:', error));

        // Load Social Links data
        fetch('logos.json')
            .then(response => response.json())
            .then(data => {
                const linksContainer = document.getElementById('social-links-container');
                data.social_links.forEach(link => {
                    const anchor = document.createElement('a');
                    anchor.href = link.url;
                    anchor.target = "_blank";
                    
                    const img = document.createElement('img');
                    img.src = link.icon;
                    img.alt = link.name;
                    img.className = 'link-icon';
                    
                    anchor.appendChild(img);
                    linksContainer.appendChild(anchor);
                });
            })
            .catch(error => console.error('Error loading logos.json:', error));
    </script>
</body>
</html>
